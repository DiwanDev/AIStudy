<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AIStudy{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">

        <a href="{{ url_for('home') }}" class="logo">
            AIStudy
        </a>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="#">Register</a>
            <a href="#">Login</a>
        </div>

    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>AIStudy — Learn smarter with your notes.</p>
    </footer>

</body>

</html>
