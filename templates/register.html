{% extends "base.html" %}


{% block title %}
Register | AIStudy
{% endblock %}


{% block content %}

<section class="form-section">

    <div class="form-card">

        <h1>Create Account</h1>

        <p class="form-description">
            Create your AIStudy account to upload notes
            and track your learning.
        </p>

        {% if message %}

            <div class="message {% if success %}success{% endif %}">
                {{ message }}
            </div>

        {% endif %}

        <form method="POST"
              action="{{ url_for('register') }}">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    value="{{ name or '' }}"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    value="{{ email or '' }}"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter the password again"
                    required
                >

            </div>

            <button type="submit" class="form-button">
                Create Account
            </button>

        </form>

        <p class="form-footer">
            Already have an account?
            <a href="#">Login</a>
        </p>

    </div>

</section>

{% endblock %}
